<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>לוז מכבי 3</title>
<meta name="description" content="לוח משחקים מתעדכן של מכבי תל אביב 3 עם חופשות משרד החינוך והוספה ליומן">
<meta name="theme-color" content="#0b2a6f">
<style>
/* Layout: כותרת כחולה מלאה. לוח שנה חודשי (ימי משחק וחופשות) לצד הרשימה: שתי עמודות במסך רחב, לשוניות בנייד. צבעים: כחול וצהוב של מכבי תל אביב, בלי לוגו. */
:root{
  --bg:#f3f5fa;--card:#ffffff;--ink:#14213d;--muted:#566079;--line:#dfe4ef;
  --brand:#0b2a6f;--brand-ink:#ffffff;--accent:#ffd21f;--accent-ink:#2a2200;
  --hdr:#0b2a6f;--hdr-ink:#ffffff;--hdr-sub:#cdd8f5;
  --alt-ink:#0b2a6f;--alt-line:#0b2a6f;--toast:#14213d;--toast-ink:#ffffff;
  --warn-bg:#fff1c2;--warn-ink:#5c4400;--bad-bg:#fde3e3;--bad-ink:#7a1212;
  --info-bg:#e4ecff;--info-ink:#12307a;--ok-bg:#dff4e6;--ok-ink:#145a2c;
  --st-hdr:#0f1a33;--st-hdr-ink:#ffffff;--st-hdr-sub:#a9b6d9;
  --radius:16px;--shadow:0 1px 2px rgba(20,33,61,.06),0 6px 18px rgba(20,33,61,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1222;--card:#151d33;--ink:#eef1f9;--muted:#a3aec9;--line:#27324f;
    --brand:#3d63d1;--hdr:#101a3a;--alt-ink:#bcd0ff;--alt-line:#3d63d1;--toast:#eef1f9;--toast-ink:#14213d;
    --warn-bg:#3d3210;--warn-ink:#ffe08a;--bad-bg:#431a1a;--bad-ink:#ffb4b4;
    --info-bg:#1b2b57;--info-ink:#bcd0ff;--ok-bg:#16361f;--ok-ink:#a8e6bb;--st-hdr:#0a1020;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --st-hdr:#0a1020;--bg:#0c1222;--card:#151d33;--ink:#eef1f9;--muted:#a3aec9;--line:#27324f;
  --brand:#3d63d1;--hdr:#101a3a;--alt-ink:#bcd0ff;--alt-line:#3d63d1;--toast:#eef1f9;--toast-ink:#14213d;
  --warn-bg:#3d3210;--warn-ink:#ffe08a;--bad-bg:#431a1a;--bad-ink:#ffb4b4;
  --info-bg:#1b2b57;--info-ink:#bcd0ff;--ok-bg:#16361f;--ok-ink:#a8e6bb;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew",Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--hdr);color:var(--hdr-ink);padding-block:20px 22px;border-bottom:5px solid var(--accent)}
header .wrap{padding-bottom:0}
h1{margin:0;font-size:1.65rem;line-height:1.2;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--hdr-sub);font-size:.95rem}
h2{font-size:1.1rem;margin:28px 0 10px}
.updated{display:inline-block;margin-top:10px;font-size:.8rem;color:var(--hdr-sub)}
.banner{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-size:.93rem}
.banner a{color:inherit;font-weight:600}

/* פריסה: לוח שנה + רשימה */
.topbox{margin-top:12px}
.topbox .card{margin:0}
@media (max-width:899px){.topbox{max-width:640px;margin-inline:auto;width:100%}}
.layout{display:grid;gap:20px;margin-top:4px}
.tabs{display:flex;gap:6px;margin:16px 0 0;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:640px;margin-inline:auto}
.tabs button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
@media (min-width:900px){
  .tabs{display:none}
  .layout{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start;gap:28px;margin-top:8px}
}
@media (max-width:899px){
  .layout{max-width:640px;margin-inline:auto;width:100%}
  .layout[data-view="cal"] #listPane{display:none}
  .layout[data-view="list"] #calPane{display:none}
}

/* כרטיסים ורשימה */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow);min-width:0}
.card.hero{border:2px solid var(--brand);padding:18px}
.kicker{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:.85rem;color:var(--muted)}
.when{font-size:1.2rem;font-weight:700}
.count{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:2px 12px;font-size:.85rem;white-space:nowrap}
.venue{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.venue small{display:block;color:var(--warn-ink);background:var(--warn-bg);border-radius:8px;padding:2px 8px;margin-top:6px;width:fit-content;max-width:100%}
.game{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.game:first-of-type{border-top:0}
.game>div{min-width:0}
.game .time{min-width:3.4rem;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.gatherline{margin:.35rem 0 0;font-size:1rem}
.dhead{display:flex;gap:14px;align-items:flex-start}
.dmain{min-width:0;flex:1}
.dtile{flex:none;width:58px;border-radius:14px;background:var(--info-bg);color:var(--info-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;line-height:1.1}
.dtile .dnum{font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums}
.dtile small{font-size:.75rem;font-weight:700}
.hero .dtile{background:var(--brand);color:var(--brand-ink)}
.cd{margin:.3rem 0 0;font-size:.95rem;color:var(--muted)}
.cd strong{color:var(--ink);font-size:1.05rem}
.st-card{padding:0;overflow:hidden}
.st-head{background:var(--st-hdr);color:var(--st-hdr-ink);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.st-head strong{font-size:1.1rem}
.st-head span{font-size:.85rem;color:var(--st-hdr-sub)}
.st-head .st-sample{margin-top:6px;background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:2px 8px;width:fit-content;font-weight:700}
.st-wrap{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
table.st th{font-size:.75rem;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.st td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:center}
table.st th.tm,table.st td.tm{text-align:start;width:100%}
table.st td.pts{font-weight:800;color:var(--alt-ink)}
table.st tr.mine td{background:var(--info-bg);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.st-note{margin:0 0 6px;color:var(--ink);font-weight:600}
.st-foot{padding:8px 16px 12px;font-size:.78rem;color:var(--muted)}
.kicker .badge{margin-inline-start:.5rem}
.game .opp{font-weight:700}
.game .meta{font-size:.85rem;color:var(--muted)}
.game.off .opp{text-decoration:line-through;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--info-bg);color:var(--info-ink)}
.badge.home{background:var(--ok-bg);color:var(--ok-ink)}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.badge.bad{background:var(--bad-bg);color:var(--bad-ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;max-width:100%;padding:0 16px;border-radius:12px;border:2px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--alt-ink);border-color:var(--alt-line)}
.month{margin:22px 0 4px;font-size:.9rem;font-weight:700;color:var(--muted)}
.sub-card p{margin:0 0 8px}
label.chk{display:flex;gap:10px;align-items:center;min-height:44px}
label.chk input{width:22px;height:22px}
.hol{display:flex;gap:12px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.hol:first-child{border-top:0}
.hol>div{min-width:0}
.hol .nm{font-weight:700}
.hol .dt{font-size:.88rem;color:var(--muted)}
.hol .nt{font-size:.82rem;color:var(--muted);margin-top:2px}
details.past summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.pastrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.empty{color:var(--muted);text-align:center;padding:26px 8px}
footer{margin-top:30px;font-size:.82rem;color:var(--muted)}
footer a{color:inherit}

/* לוח שנה חודשי */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.cal-title{font-size:1.25rem;font-weight:800}
.icon-btn{min-width:44px;min-height:44px;border-radius:12px;border:2px solid var(--alt-line);background:transparent;color:var(--alt-ink);font:inherit;font-size:1.2rem;font-weight:700;cursor:pointer}
.icon-btn:disabled{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:10px}
.cal-wd{text-align:center;font-size:.78rem;font-weight:700;color:var(--muted);padding:4px 0}
.cal-day{position:relative;min-height:72px;padding:4px 3px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:start;display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden;min-width:0}
.cal-day.empty{border:0;background:transparent;cursor:default}
.cal-day .num{font-size:.82rem;font-weight:700;color:var(--muted);line-height:1.1}
.cal-day.today{border:2px solid var(--brand)}
.cal-day.today .num{color:var(--ink)}
.cal-day.sel{outline:3px solid var(--accent);outline-offset:1px}
.cal-day.hol{background:var(--warn-bg)}
.cal-day.unsure{background:repeating-linear-gradient(135deg,var(--warn-bg) 0 5px,var(--card) 5px 10px)}
.cal-day.short{box-shadow:inset 0 -4px 0 var(--warn-bg)}
.cal-day.yend{background:var(--info-bg)}
.chip{display:block;font-size:.68rem;font-weight:800;line-height:1.35;border-radius:6px;padding:0 3px;background:var(--brand);color:var(--brand-ink);border:1.5px solid var(--brand);text-align:center;font-variant-numeric:tabular-nums}
.chip.away{background:transparent;color:var(--ink);border-color:var(--alt-line)}
.chip.off{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-bg);text-decoration:line-through}
.chip.past{opacity:.5}
.hl{display:block;font-size:.62rem;line-height:1.2;color:var(--warn-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-day.yend .hl,.cal-day.unsure .hl{color:var(--info-ink)}
@media (max-width:520px){.hl{display:none}.cal-day{min-height:66px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:14px;border-radius:4px;border:1.5px solid var(--brand);background:var(--brand)}
.legend i.away{background:transparent;border-color:var(--alt-line)}
.legend i.h{background:var(--warn-bg);border-color:var(--line)}
.legend i.u{background:repeating-linear-gradient(135deg,var(--warn-bg) 0 4px,var(--card) 4px 8px);border-color:var(--line)}
.legend i.y{background:var(--info-bg);border-color:var(--line)}
.cal-tools{margin-top:12px}
.detail{margin-top:8px}

.btn:focus-visible,summary:focus-visible,input:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.toast{position:fixed;inset-inline:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;background:var(--toast);color:var(--toast-ink);border-radius:12px;padding:12px 16px;text-align:center;z-index:5}
</style>
</head>
<body>
<header><div class="wrap">
  <h1 id="title">מכבי 3</h1>
  <p class="sub" id="subtitle">לוח משחקים</p>
  <span class="updated" id="updated"></span>
</div></header>

<main class="wrap" id="app" aria-live="polite">
  <p class="empty">טוען את הלוז…</p>
</main>

<script>
"use strict";
const TZ = "Asia/Jerusalem";
const $app = document.getElementById("app");

/* ---------- DOM helper: כל טקסט שמגיע מהנתונים נכנס כ-textContent, לעולם לא כ-HTML ---------- */
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
const safeUrl = u => /^https?:\/\//.test(u || "") ? u : null;

/* ---------- תאריכים: הכול לפי שעון ישראל, בלי תלות באזור הזמן של המכשיר ---------- */
function nowIL() {
  const p = new Intl.DateTimeFormat("en-CA", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23"}).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return {date: `${g("year")}-${g("month")}-${g("day")}`, time: `${g("hour")}:${g("minute")}`};
}
const noon = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); };
const dayDiff = (a, b) => Math.round((noon(b) - noon(a)) / 864e5);
const addDays = (s, n) => { const d = noon(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const ymOf = s => s.slice(0, 7);
function addMonth(ym, n) {
  let [y, m] = ym.split("-").map(Number); m += n;
  while (m > 12) { m -= 12; y++; }
  while (m < 1) { m += 12; y--; }
  return `${y}-${String(m).padStart(2, "0")}`;
}
const daysInMonth = ym => { const [y, m] = ym.split("-").map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
const firstDow = ym => { const [y, m] = ym.split("-").map(Number); return new Date(Date.UTC(y, m - 1, 1)).getUTCDay(); }; // 0 = ראשון
const F = {
  long: new Intl.DateTimeFormat("he-IL", {weekday: "long", day: "numeric", month: "long", timeZone: "UTC"}),
  short: new Intl.DateTimeFormat("he-IL", {weekday: "short", day: "numeric", month: "numeric", timeZone: "UTC"}),
  month: new Intl.DateTimeFormat("he-IL", {month: "long", year: "numeric", timeZone: "UTC"}),
  mon: new Intl.DateTimeFormat("he-IL", {month: "short", timeZone: "UTC"}),
  stamp: new Intl.DateTimeFormat("he-IL", {day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit", timeZone: TZ}),
};
function rel(days) {
  if (days === 0) return "היום";
  if (days === 1) return "מחר";
  if (days === 2) return "מחרתיים";
  if (days === -1) return "אתמול";
  if (days < 0) return `לפני ${-days} ימים`;
  return `בעוד ${days} ימים`;
}

/* ספירה לאחור עד שעה נתונה (שעון ישראל). חוזר null אם עברה. */
function countdown(date, time, ctx) {
  const mins = dayDiff(ctx.today, date) * 1440 + toMin(time) - toMin(ctx.now);
  if (mins <= 0) return null;
  const d = Math.floor(mins / 1440), hh = Math.floor((mins % 1440) / 60), m = mins % 60;
  const D = n => n === 1 ? "יום" : n === 2 ? "יומיים" : `${n} ימים`;
  const H = n => n === 1 ? "שעה" : n === 2 ? "שעתיים" : `${n} שעות`;
  const M = n => n === 1 ? "דקה" : n === 2 ? "שתי דקות" : `${n} דקות`;
  if (d > 0) return hh ? `${D(d)} ו-${H(hh)}` : D(d);
  if (hh > 0) return m ? `${H(hh)} ו-${M(m)}` : H(hh);
  return M(m);
}

/* ---------- ניווט וקישורים ---------- */
const wazeUrl = g => "https://waze.com/ul?q=" + encodeURIComponent(g.address || g.venue) + "&navigate=yes";
const mapsUrl = g => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(g.address || g.venue);

function toast(msg) {
  const t = el("div", {class: "toast", role: "status", text: msg});
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- רכיבי תצוגה: רשימה ---------- */
function gameRow(g) {
  const badges = [];
  if (g.status === "postponed") badges.push(el("span", {class: "badge bad", text: "נדחה"}));
  if (g.status === "cancelled") badges.push(el("span", {class: "badge bad", text: "בוטל"}));
  if (g.recently_changed && g.status === "scheduled") badges.push(el("span", {class: "badge warn", text: "עודכן לאחרונה"}));
  for (const c of g.conflicts || []) {
    if (c.kind === "holiday") badges.push(el("span", {class: "badge warn", text: `חל בחופשה: ${c.name}`}));
    if (c.kind === "uncertain") badges.push(el("span", {class: "badge warn", text: `${c.name}: לא ודאי אם יש לימודים`}));
    if (c.kind === "note") badges.push(el("span", {class: "badge", text: c.name}));
  }
  const off = g.status !== "scheduled";
  return el("div", {class: "game" + (off ? " off" : "")},
    el("div", {class: "time", text: g.time}),
    el("div", {},
      el("div", {class: "opp", text: `נגד ${g.opponent}`}),
      el("div", {class: "meta", text: [g.round ? `מחזור ${g.round}` : "", g.note].filter(Boolean).join(" · ")}),
      badges.length ? el("div", {class: "badges"}, badges) : null));
}

const kindOf = d => d.home === true ? "בית" : d.home === false ? "חוץ" : "";
const dayTitle = (d, n) => n > 1 ? `טורניר ${kindOf(d)}`.trim() : (kindOf(d) ? `משחק ${kindOf(d)}` : "משחק");

function shareText(d, games, team) {
  const lines = [`${team}: ${dayTitle(d, games.length)}, ${F.long.format(noon(d.date))}`, `כינוס: ${d.gather}`];
  for (const g of games) lines.push(`${g.time} נגד ${g.opponent}${g.status !== "scheduled" ? " [" + (g.status === "postponed" ? "נדחה" : "בוטל") + "]" : ""}`);
  if (d.venue) lines.push(`אולם: ${d.venue}`);
  lines.push(location.href.split("#")[0]);
  return lines.join("\n");
}

/* כרטיס יום טורניר: אולם אחד, כינוס אחד, עד שלוש קבוצות */
function dayCard(d, games, ctx, hero, force) {
  const diff = dayDiff(ctx.today, d.date);
  const unverified = d.venue && !d.address_verified;
  const nav = [];
  if (d.venue) {
    nav.push(el("a", {class: "btn", href: wazeUrl(d), target: "_blank", rel: "noopener"}, "ניווט ב-Waze"));
    nav.push(el("a", {class: "btn alt", href: mapsUrl(d), target: "_blank", rel: "noopener"}, "Google Maps"));
  }
  nav.push(el("a", {class: "btn alt", href: "https://wa.me/?text=" + encodeURIComponent(shareText(d, games, ctx.data.team)), target: "_blank", rel: "noopener"}, "שיתוף בוואטסאפ"));
  const others = (d.teams || []).slice(1);
  const kind = kindOf(d);
  const first = games[0];
  const off = games.every(g => g.status !== "scheduled");

  return el("section", {class: "card" + (hero ? " hero" : "")},
    el("div", {class: "kicker"},
      el("span", {}, hero ? (games.length > 1 ? "הטורניר הקרוב" : "המשחק הקרוב") : dayTitle(d, games.length),
        kind ? el("span", {class: "badge" + (d.home ? " home" : ""), text: kind}) : null),
      el("span", {class: "count", text: rel(diff)})),
    el("div", {class: "dhead"},
      el("div", {class: "dtile", "aria-hidden": "true"}, el("span", {class: "dnum", text: String(Number(d.date.slice(8)))}), el("small", {text: F.mon.format(noon(d.date))})),
      el("div", {class: "dmain"},
        el("div", {class: "when", text: F.long.format(noon(d.date))}),
        off ? null : el("p", {class: "gatherline"}, el("strong", {text: `כינוס ב-${d.gather}`}), `  ·  משחקים ${d.start_time}${d.end_time !== d.start_time ? " עד " + d.end_time : ""}`),
        (hero && !off && countdown(d.date, d.gather, ctx)) ? el("p", {class: "cd"}, "עד הכינוס: ", el("strong", {text: countdown(d.date, d.gather, ctx)})) : null)),
    d.venue ? el("p", {class: "venue"}, d.venue,
      unverified ? el("small", {text: "הכתובת המדויקת לא אומתה. הניווט מחפש לפי שם האולם, כדאי לוודא."}) : null) : null,
    others.length > 1 ? el("p", {class: "meta", text: `בטורניר: ${(d.teams || []).join(" · ")}`}) : null,
    games.map(g => gameRow(g)),
    hero || force || (diff >= 0 && diff <= 14) ? el("div", {class: "actions"}, nav) : null);
}

function standingsCard(ctx) {
  const s = ctx.data.standings;
  if (!s || !Array.isArray(s.rows) || !s.rows.length) return null;
  const me = ctx.data.team_full || ctx.data.team;
  const num = v => (v == null ? "" : String(v));
  const diff = v => (v == null ? "" : v > 0 ? `+${v}` : String(v));
  const th = (t, cls) => el("th", {scope: "col", class: cls, text: t});
  const rows = s.rows.map((r, i) => el("tr", {class: r.team === me ? "mine" : null},
    el("td", {text: num(r.rank != null ? r.rank : i + 1)}),
    el("td", {class: "tm", text: r.team}),
    el("td", {text: num(r.played)}), el("td", {text: num(r.wins)}), el("td", {text: num(r.losses)}),
    el("td", {text: diff(r.diff)}), el("td", {class: "pts", text: num(r.points)})));
  const upd = Date.parse(s.updated);
  return el("section", {class: "card st-card", id: "standings"},
    el("div", {class: "st-head"},
      el("strong", {text: "דירוג נוכחי"}),
      el("span", {text: [s.league, s.region].filter(Boolean).join(" · ")}),
      s.sample ? el("span", {class: "st-sample", text: "דוגמה לעיצוב בלבד, הנתונים אינם אמיתיים"}) : null),
    el("div", {class: "st-wrap"}, el("table", {class: "st"},
      el("caption", {class: "sr", text: "טבלת הליגה"}),
      el("thead", {}, el("tr", {}, th("#"), th("קבוצה", "tm"), th("מ׳"), th("נ׳"), th("ה׳"), th("הפרש"), th("נק׳"))),
      el("tbody", {}, rows))),
    el("div", {class: "st-foot"},
      s.rows.every(r => !r.played) ? el("p", {class: "st-note", text: "העונה עוד לא התחילה, ולכן כל הקבוצות על אפס. הסדר בטבלה עדיין לא משקף כלום ויתעדכן אחרי המשחקים הראשונים."}) : null,
      isNaN(upd) ? "הדירוג נמשך מאתר איגוד הכדורעף." : `הדירוג נמשך מאתר איגוד הכדורעף. עודכן: ${F.stamp.format(new Date(upd))}`));
}

function subscribeCard() {
  const secure = location.protocol === "https:" || location.protocol === "http:";
  const base = location.href.replace(/[#?].*$/, "").replace(/[^/]*$/, "");
  const chk = el("input", {type: "checkbox", id: "withHol"});
  const feed = () => base + (chk.checked ? "maccabi3-with-holidays.ics" : "maccabi3.ics");
  const web = () => feed().replace(/^https?:/, "webcal:");
  const apple = el("a", {class: "btn", href: "#"}, "הוספה ליומן באייפון");
  const google = el("a", {class: "btn alt", href: "#", target: "_blank", rel: "noopener"}, "הוספה ליומן גוגל");
  const copy = el("button", {class: "btn alt", type: "button"}, "העתקת קישור");
  const sync = () => { apple.href = web(); google.href = "https://calendar.google.com/calendar/r?cid=" + web(); };
  chk.addEventListener("change", sync); sync();
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(feed()); toast("הקישור הועתק"); } catch { prompt("העתיקו את הקישור:", feed()); }
  });
  return el("section", {class: "card sub-card", id: "subscribe"},
    el("p", {}, el("strong", {text: "מקבלים את כל המשחקים ביומן, ומתעדכן לבד"})),
    el("p", {class: "meta", text: "מוסיפים פעם אחת. כשמשחק נדחה או שהשעה משתנה, האירוע ביומן מתעדכן בלי שתעשו כלום (יכול לקחת כמה שעות, תלוי באפליקציית היומן)."}),
    el("label", {class: "chk"}, chk, "כולל חופשות משרד החינוך"),
    secure ? el("div", {class: "actions"}, apple, google, copy) : el("p", {class: "badge warn", text: "הכפתורים יעבדו אחרי שהדף יועלה לאתר."}));
}

function holRow(h, ctx) {
  const active = h.start <= ctx.today && ctx.today <= h.end;
  const ended = h.end < ctx.today;
  const range = h.start === h.end ? F.short.format(noon(h.start)) : `${F.short.format(noon(h.start))} עד ${F.short.format(noon(h.end))}`;
  const ret = h.return_date ? ` · חזרה ללימודים ${F.short.format(noon(h.return_date))}` : "";
  const badge = h.type === "disputed" ? el("span", {class: "badge warn", text: "לא ודאי"})
    : h.type === "short_day" ? el("span", {class: "badge", text: "יום קצר"})
    : el("span", {class: "badge" + (active ? " warn" : ""), text: active ? "עכשיו" : ended ? "עבר" : rel(Math.max(0, dayDiff(ctx.today, h.start)))});
  return el("div", {class: "hol"},
    el("div", {}, el("div", {class: "nm", text: h.name}), el("div", {class: "dt", text: range + ret}), h.note ? el("div", {class: "nt", text: h.note}) : null),
    el("div", {}, badge));
}

function holidaysCard(ctx) {
  const items = ctx.data.holidays.filter(h => h.end >= ctx.today && ["break", "off", "short_day", "disputed"].includes(h.type));
  const yearEnd = ctx.data.holidays.filter(h => h.type === "year_end" && h.end >= ctx.today);
  if (!items.length && !yearEnd.length) return null;
  const rows = items.map(h => holRow(h, ctx));
  for (const h of yearEnd) rows.push(el("div", {class: "hol"}, el("div", {}, el("div", {class: "nm", text: h.name}), el("div", {class: "dt", text: `החופש הגדול מתחיל ${F.short.format(noon(h.start))}`}), h.note ? el("div", {class: "nt", text: h.note}) : null)));
  return el("section", {class: "card"}, rows);
}

function pastCard(past) {
  if (!past.length) return null;
  const rows = past.slice().reverse().map(g => {
    const sc = g.score ? `${g.score.home}:${g.score.away}` : (g.result_text || "");
    return el("div", {class: "pastrow"}, el("span", {text: `${F.short.format(noon(g.date))} · נגד ${g.opponent}`}), el("span", {text: sc || "ללא תוצאה"}));
  });
  return el("details", {class: "card past"}, el("summary", {text: `משחקים שהסתיימו (${past.length})`}), rows);
}

/* ---------- לוח שנה חודשי ---------- */
const CAL_TYPES = ["break", "off", "short_day", "disputed", "year_end"];
function holMap(data) {
  const m = new Map();
  for (const h of data.holidays) {
    if (!CAL_TYPES.includes(h.type)) continue;
    for (let d = h.start; d <= h.end; d = addDays(d, 1)) {
      if (!m.has(d)) m.set(d, []);
      m.get(d).push(h);
    }
  }
  return m;
}
const WEEKDAYS = ["א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ש׳"];
const holLabel = h => h.type === "year_end" ? "החופש הגדול" : h.name.replace(/^חופשת /, "");

function calendarPane(ctx) {
  const {data, today} = ctx;
  const hm = holMap(data);
  const byId = new Map(data.games.map(g => [g.id, g]));
  const dayGames = d => d.game_ids.map(id => byId.get(id)).filter(Boolean);
  const daysBy = new Map();
  for (const d of ctx.days) { if (!daysBy.has(d.date)) daysBy.set(d.date, []); daysBy.get(d.date).push(d); }

  const nextDay = ctx.days.find(d => dayGames(d).some(g => !ctx.isPast(g)));
  let selected = nextDay ? nextDay.date : today;
  let month = ymOf(selected);
  const dates = [today, ...ctx.days.map(d => d.date)];
  const firstMonth = ymOf(dates.slice().sort()[0]);
  const lastRef = [...ctx.days.map(d => d.date), ...data.holidays.filter(h => CAL_TYPES.includes(h.type)).map(h => h.start)].sort().pop() || today;
  const lastMonth = ymOf(lastRef) > month ? ymOf(lastRef) : month;

  const box = el("div");

  function cell(date, dow) {
    const ds = daysBy.get(date) || [];
    const hs = hm.get(date) || [];
    const types = hs.map(h => h.type);
    const cls = ["cal-day"];
    if (date === today) cls.push("today");
    if (date === selected) cls.push("sel");
    if (types.includes("break") || types.includes("off")) cls.push("hol");
    else if (types.includes("disputed")) cls.push("unsure");
    else if (types.includes("year_end")) cls.push("yend");
    if (types.includes("short_day")) cls.push("short");
    const labelH = hs.find(h => (date === h.start || dow === 0) && h.type !== "short_day");
    const aria = [F.long.format(noon(date)),
      ...ds.map(d => `${dayTitle(d, d.game_ids.length)}, כינוס ${d.gather}, משחקים ${d.start_time}${d.end_time !== d.start_time ? " עד " + d.end_time : ""}`),
      ...hs.map(h => h.name)].filter(Boolean).join(". ");
    return el("button", {class: cls.join(" "), type: "button", "data-date": date, "aria-label": aria, "aria-pressed": date === selected ? "true" : "false",
        onclick: () => { selected = date; draw(date); }},
      el("span", {class: "num", text: String(Number(date.slice(8)))}),
      ds.map(d => el("span", {class: "chip" + (d.home === false ? " away" : "") + (dayGames(d).length && dayGames(d).every(g => g.status !== "scheduled") ? " off" : "") + (dayGames(d).every(g => ctx.isPast(g)) ? " past" : ""), text: d.gather})),
      labelH ? el("span", {class: "hl", text: holLabel(labelH)}) : null);
  }

  function detail() {
    const ds = daysBy.get(selected) || [];
    const hs = hm.get(selected) || [];
    const out = el("div", {class: "detail"});
    if (!ds.length && !hs.length) out.append(el("p", {class: "empty", text: `${F.long.format(noon(selected))}: אין משחקים או חופשות.`}));
    for (const d of ds) out.append(dayCard(d, dayGames(d), ctx, false, true));
    if (hs.length) out.append(el("section", {class: "card"}, el("div", {class: "kicker"}, el("span", {text: F.long.format(noon(selected))})), hs.map(h => holRow(h, ctx))));
    return out;
  }

  function draw(focusDate) {
    const n = daysInMonth(month), lead = firstDow(month);
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push(el("div", {class: "cal-day empty", "aria-hidden": "true"}));
    for (let d = 1; d <= n; d++) cells.push(cell(`${month}-${String(d).padStart(2, "0")}`, (lead + d - 1) % 7));

    const prev = el("button", {class: "icon-btn", type: "button", "aria-label": "חודש קודם", disabled: month <= firstMonth, onclick: () => { month = addMonth(month, -1); draw(); }}, "→");
    const next = el("button", {class: "icon-btn", type: "button", "aria-label": "חודש הבא", disabled: month >= lastMonth, onclick: () => { month = addMonth(month, 1); draw(); }}, "←");
    const jump = el("a", {class: "btn alt", href: "#subscribe", onclick: ev => {
      ev.preventDefault();
      const lay = document.querySelector(".layout"); if (lay) lay.dataset.view = "list";
      document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === "list")));
      const t = document.getElementById("subscribe"); if (t && t.scrollIntoView) t.scrollIntoView({block: "start"});
    }}, "הוספה ליומן שלי");

    box.replaceChildren(
      el("div", {class: "cal-head"}, prev, el("div", {class: "cal-title", "aria-live": "polite", text: F.month.format(noon(month + "-01"))}), next),
      el("div", {class: "cal-grid", role: "group", "aria-label": "לוח חודשי"}, WEEKDAYS.map(w => el("div", {class: "cal-wd", text: w})), cells),
      el("div", {class: "legend"},
        el("span", {}, el("i"), "טורניר בית (שעת כינוס)"), el("span", {}, el("i", {class: "away"}), "טורניר חוץ (שעת כינוס)"),
        el("span", {}, el("i", {class: "h"}), "חופשה / אין לימודים"), el("span", {}, el("i", {class: "u"}), "לא ודאי")),
      detail(),
      el("div", {class: "cal-tools"}, jump));
    if (focusDate) { const b = box.querySelector(`[data-date="${focusDate}"]`); if (b) b.focus(); }
  }
  draw();
  return box;
}

/* ---------- הרכבת הדף ---------- */
function render(data) {
  const n = nowIL();
  const ctx = {data, today: n.date, now: n.time};
  document.getElementById("title").textContent = data.team;
  document.getElementById("subtitle").textContent = [data.league, data.season && `עונת ${data.season}`].filter(Boolean).join(" · ") || "לוח משחקים";
  document.title = `${data.team}: לוח משחקים`;

  const checked = Date.parse(data.checked_at);
  document.getElementById("updated").textContent = isNaN(checked) ? "" : `נבדק לאחרונה: ${F.stamp.format(new Date(checked))}`;

  const isPast = g => g.date < ctx.today || (g.date === ctx.today && toMin(g.time) + (g.duration_min || 75) < toMin(ctx.now));
  ctx.isPast = isPast;
  const byId = new Map(data.games.map(g => [g.id, g]));
  const days = (data.days && data.days.length) ? data.days : data.games.map(g => ({key: g.id, date: g.date, venue: g.venue, address: g.address, address_verified: g.address_verified, home: g.home, gather: g.gather, start_time: g.time, end_time: g.time, teams: [], game_ids: [g.id]}));
  ctx.days = days;
  const dayGames = d => d.game_ids.map(id => byId.get(id)).filter(Boolean);
  const upcomingDays = days.filter(d => dayGames(d).some(g => !isPast(g)));
  const past = days.filter(d => !upcomingDays.includes(d)).flatMap(dayGames);

  let banner = null;
  const ageH = isNaN(checked) ? Infinity : (Date.now() - checked) / 36e5;
  if (data.scrape && data.scrape.configured && ageH > (data.warn_after_hours || 6)) {   // כשל בודד (502 זמני) לא מפחיד הורים; פער של כמה סריקות כן
    const src = safeUrl(data.source_url);
    banner = el("div", {class: "banner", role: "alert"},
      "העדכון האוטומטי לא הצליח לאחרונה, ייתכן שיש שינויים שעדיין לא מופיעים כאן. ",
      src ? el("a", {href: src, target: "_blank", rel: "noopener"}, "בדקו באתר ההתאחדות") : null, ".");
  }

  const list = [];
  if (!upcomingDays.length) {
    list.push(el("p", {class: "empty", text: data.games.length ? "אין משחקים קרובים בלוז." : "עדיין לא פורסמו משחקים."}));
  } else {
    let i = 0, lastMonth = "";
    for (const d of upcomingDays) {
      if (i > 0) {
        const m = F.month.format(noon(d.date));
        if (m !== lastMonth) { list.push(el("div", {class: "month", text: m})); lastMonth = m; }
      } else lastMonth = F.month.format(noon(d.date));
      list.push(dayCard(d, dayGames(d), ctx, i === 0, false));
      i++;
    }
  }
  const stCard = standingsCard(ctx);
  const topBox = stCard ? el("div", {class: "topbox"}, stCard) : null;
  list.push(subscribeCard());
  const hol = holidaysCard(ctx);
  if (hol) { list.push(el("h2", {text: "חופשות משרד החינוך"})); list.push(hol); }
  const pc = pastCard(past);
  if (pc) list.push(pc);

  const official = safeUrl(data.official_holidays_url);
  const foot = el("footer", {},
    el("p", {}, "המשחקים נמשכים אוטומטית מאתר איגוד הכדורעף כמה פעמים ביום. במקרה של פער, הנתון באתר ההתאחדות הוא הקובע. "),
    el("p", {}, "לוח החופשות נאסף ממקורות פומביים ולא מהחוזר הרשמי עצמו", official ? [" (", el("a", {href: official, target: "_blank", rel: "noopener"}, "החוזר הרשמי"), ")"] : null, ". פריטים המסומנים 'לא ודאי' יש לאמת מול בית הספר."));

  const calPane = el("div", {class: "pane", id: "calPane", role: "tabpanel"}, calendarPane(ctx));
  const listPane = el("div", {class: "pane", id: "listPane", role: "tabpanel"}, list);
  const layout = el("div", {class: "layout", "data-view": "cal"}, calPane, listPane);
  const tabBtn = (view, label) => el("button", {type: "button", role: "tab", "data-view": view, "aria-controls": view === "cal" ? "calPane" : "listPane", "aria-selected": String(view === "cal"),
    onclick: () => { layout.dataset.view = view; tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view))); }}, label);
  const tabs = el("div", {class: "tabs", role: "tablist", "aria-label": "תצוגה"}, tabBtn("cal", "לוח שנה"), tabBtn("list", "רשימה"));

  $app.replaceChildren(...[banner, topBox, tabs, layout, foot].filter(Boolean));
}

fetch("data.json?v=" + Date.now(), {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => $app.replaceChildren(el("p", {class: "empty", text: "לא הצלחנו לטעון את הלוז. נסו לרענן, או בדקו באתר איגוד הכדורעף."})));
</script>
</body>
</html>
